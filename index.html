    <style>
        /* Modern hidden scrollbars */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #141414; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2f2f2f; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f3f; }
        
        /* STRICT PLAYER FIXES FOR ALL MONITORS/SCREENS
           Ensures player takes exact space, controls stay visible, and video never crops.
        */
        .player-container {
            position: relative;
            width: 100%;
            background-color: #000000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        
        /* Forces 16:9 Aspect Ratio aspect layout across all responsive sizes */
        @media (min-width: 1024px) {
            .player-container {
                height: 100%;
                aspect-ratio: 16 / 9;
            }
        }
        @media (max-width: 1023px) {
            .player-container {
                aspect-ratio: 16 / 9;
            }
        }

        /* Essential Video.js fixes to prevent video cutting/cropping and keeping full controls */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Crucial property so video fits nicely into any screen size without cutting edges */
        .video-js video {
            object-fit: contain !important; 
        }

        /* Keeps the big play button looking clean and modern */
        .vjs-big-play-centered .vjs-big-play-button { 
            background-color: rgba(220, 38, 38, 0.8) !important; 
            border: none !important; 
        }
    </style>

        let currentCategory = 'All';
        let player = null;

        document.addEventListener("DOMContentLoaded", () => {
            // Updated Player Configuration to allow exact auto scaling & full control layout
            player = videojs('live-player', {
                fluid: false, // Turned off Tailwind fluid breaking logic
                responsive: true,
                liveui: true,
                playbackRates: [0.5, 1, 1.5, 2]
            });
            renderChannels();
            document.getElementById('search-box').addEventListener('input', renderChannels);
        });

        function renderChannels() {
            const container = document.getElementById('channel-list');
            const searchQuery = document.getElementById('search-box').value.toLowerCase();
            container.innerHTML = '';

            const filtered = channels.filter(ch => {
                const matchesCategory = (currentCategory === 'All' || ch.category === currentCategory);
                const matchesSearch = ch.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-600 text-center py-8">No channels discovered</p>`;
                return;
            }

            filtered.forEach(ch => {
                const words = ch.name.trim().split(/\s+/);
                const prefix = words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : words[0][0].toUpperCase();

                const item = document.createElement('div');
                item.className = "flex items-center gap-3 p-2 rounded-md bg-[#1c1c1c] border border-zinc-800/40 hover:bg-[#262626] hover:border-zinc-700 cursor-pointer transition-all group shrink-0 flex-nowrap w-full min-w-0";
                
                item.onclick = () => playStream(ch.url, ch.name, ch.category);

                let logoHtml = '';
                if(ch.logo && ch.logo !== "") {
                    logoHtml = `<img src="${ch.logo}" alt="${ch.name}" class="w-8 h-8 rounded object-contain shrink-0 bg-zinc-900 border border-zinc-800"/>`;
                } else {
                    logoHtml = `
                        <div class="w-8 h-8 rounded bg-zinc-800 flex items-center justify-center text-zinc-300 font-bold text-xs tracking-wider group-hover:bg-red-600 group-hover:text-white transition-colors shrink-0">
                            ${prefix.substring(0, 2)}
                        </div>
                    `;
                }

                item.innerHTML = `
                    ${logoHtml}
                    <div class="overflow-hidden flex-grow min-w-0 pr-1">
                        <h4 class="text-xs font-medium text-zinc-200 group-hover:text-white truncate" title="${ch.name}">${ch.name}</h4>
                        <span class="text-[10px] text-zinc-500 block mt-0.5">${ch.category}</span>
                    </div>
                    <div class="text-[10px] text-zinc-600 opacity-0 group-hover:opacity-100 pr-1 transition-opacity shrink-0">
                        ▶
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function playStream(url, name, category) {
            document.getElementById('player-placeholder').classList.add('hidden');
            document.getElementById('video-wrapper').classList.remove('hidden');
            
            document.getElementById('current-active-channel').textContent = name;
            document.getElementById('current-active-category').textContent = category + " Network Active";

            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            player.ready(() => {
                player.play().catch(error => {
                    console.log("Streaming block engine intercept: ", error);
                });
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.textContent === cat || (cat === 'All' && btn.textContent === 'All Channel')) {
                    btn.className = "cat-btn px-3 py-1.5 rounded bg-zinc-100 text-black font-semibold cursor-pointer";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 rounded bg-[#212121] text-zinc-400 hover:bg-[#2b2b2b] cursor-pointer";
                }
            });
            renderChannels();
        }
